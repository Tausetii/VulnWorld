<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VulnWorld</title>
    <style>
    :root{
        --bg1:#1b0b3a;
        --bg2:#031a3b;
        --card:rgba(255,255,255,.10);
        --stroke:rgba(255,255,255,.22);
        --text:#f8fbff;
        --muted:rgba(248,251,255,.72);
        --neon1:#ff3df2;
        --neon2:#00e5ff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body {
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2.5rem 1.5rem;
        background:
            radial-gradient(900px 420px at 15% 12%, rgba(255,61,242,.30), transparent 60%),
            radial-gradient(820px 460px at 85% 22%, rgba(0,229,255,.26), transparent 60%),
            linear-gradient(160deg, var(--bg1), var(--bg2));
    }
    h1 {
        font-size: 2.25rem;
        font-weight: 800;
        margin-bottom: 1rem;
        letter-spacing: 1px;
        text-shadow: 0 0 14px rgba(0,229,255,.35);
    }
    .panel{
        width: min(860px, 100%);
        background: var(--card);
        border: 1px solid var(--stroke);
        border-radius: 18px;
        padding: 1.5rem;
        backdrop-filter: blur(10px);
        box-shadow: 0 18px 55px rgba(0,0,0,.35);
    }
    .controls{ display:flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 0.75rem 0 0.25rem; }
    input {
        background: rgba(0,0,0,.18);
        border: 1px solid rgba(255,255,255,.28);
        color: var(--text);
        padding: 12px 14px;
        font-size: 16px;
        width: 260px;
        outline: none;
        border-radius: 12px;
        transition: box-shadow 0.15s ease, border-color 0.15s ease;
    }
    input::placeholder { color: rgba(248,251,255,.55); }
    input:focus {
        border-color: rgba(0,229,255,.65);
        box-shadow: 0 0 0 4px rgba(0,229,255,.15);
    }
    button {
        background: linear-gradient(135deg, rgba(255,61,242,.95), rgba(0,229,255,.90));
        color: #081018;
        border: none;
        padding: 12px 18px;
        font-size: 16px;
        font-weight: 800;
        cursor: pointer;
        border-radius: 12px;
        transition: transform 0.15s ease, filter 0.15s ease;
    }
    button:hover { transform: translateY(-1px); filter: brightness(1.05); }
    ul { list-style: none; margin-top: 1rem; width: min(520px, 100%); padding: 0; }
    li {
        background: rgba(255,255,255,.08);
        border: 1px solid rgba(255,255,255,.18);
        padding: 12px 14px;
        margin-bottom: 10px;
        border-radius: 14px;
        transition: box-shadow 0.15s ease, border-color 0.15s ease;
    }
    li:hover { border-color: rgba(255,61,242,.45); box-shadow: 0 0 20px rgba(255,61,242,.12); }
</style>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        function search() {
            var budget = $("#budget_input").val();
            console.log(budget);
            $.ajax({
                url: "/search/" + budget,
                method: "GET",
                data: "budget=" + budget,
                success: function(response) {
                    $("#results_list").empty();
                    for(var i = 0; i < response.length; i++) {
                        var item = response[i];
                        $("#results_list").append("<li>" + item.name + " - $" + item.price + "</li>");
                    }
                },
                error: function(error) {
                    console.error("Error during search:", error);
                }

                // render the results on the website
            });
        }

    </script>
</head>
<body>
    <h1>Welcome to VulnWorld!</h1>
    <div class="panel">
        <p style="color: var(--muted); margin-bottom: 0.75rem;">Quick menu search (legacy page).</p>
        <div class="controls">
            <input id="budget_input" type="text" placeholder="Enter your budget" />
            <button onclick="search()">Search</button>
            <a href="/welcome" style="text-decoration:none;"><button type="button">Home</button></a>
        </div>
        <p style="color: var(--muted); margin-top: 0.5rem;">
            NOTE: This page started as a menu search bar and will evolve into a vulnerable gaming cafe site.
        </p>
        <ul id="results_list"></ul>
    </div>
</body>
</html>
