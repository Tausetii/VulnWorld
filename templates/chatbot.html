<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VulnWorld Gaming Cafe – AI Chatbot</title>
    <style>
        :root{
            --bg1:#1b0b3a;
            --bg2:#031a3b;
            --card:rgba(255,255,255,.10);
            --stroke:rgba(255,255,255,.22);
            --text:#f8fbff;
            --muted:rgba(248,251,255,.72);
            --neon1:#ff3df2;
            --neon2:#00e5ff;
            --neon3:#7CFF6B;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body {
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(900px 420px at 15% 12%, rgba(255,61,242,.30), transparent 60%),
                radial-gradient(820px 460px at 85% 22%, rgba(0,229,255,.26), transparent 60%),
                radial-gradient(700px 520px at 55% 90%, rgba(124,255,107,.16), transparent 62%),
                linear-gradient(160deg, var(--bg1), var(--bg2));
        }
        .nav { padding: 1rem 1.5rem; }
        .nav a { color: var(--muted); text-decoration: none; }
        .nav a:hover { color: var(--text); text-shadow: 0 0 12px rgba(0,229,255,.35); }
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 860px;
            width: 100%;
            margin: 0 auto;
            padding: 1.5rem;
        }
        .panel{
            flex: 1;
            display:flex;
            flex-direction: column;
            background: var(--card);
            border: 1px solid var(--stroke);
            border-radius: 18px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 18px 55px rgba(0,0,0,.35);
        }
        h1 { font-size: 1.7rem; font-weight: 800; margin-bottom: 0.4rem; }
        .sub { color: var(--muted); font-size: 0.95rem; margin-bottom: 1rem; }
        .messages {
            flex: 1;
            background: rgba(255,255,255,.07);
            border: 1px solid rgba(255,255,255,.18);
            border-radius: 16px;
            padding: 1rem;
            min-height: 320px;
            overflow-y: auto;
            margin-bottom: 1rem;
        }
        .messages p { color: rgba(248,251,255,.82); font-style: italic; }
        .input-row { display: flex; gap: 10px; flex-wrap: wrap; }
        .input-row input {
            flex: 1;
            min-width: 260px;
            background: rgba(0,0,0,.18);
            border: 1px solid rgba(255,255,255,.28);
            color: var(--text);
            padding: 12px 14px;
            font-size: 16px;
            outline: none;
            border-radius: 12px;
        }
        .input-row input:focus {
            border-color: rgba(0,229,255,.65);
            box-shadow: 0 0 0 4px rgba(0,229,255,.15);
        }
        .input-row input::placeholder { color: rgba(248,251,255,.55); }
        .input-row button {
            background: linear-gradient(135deg, rgba(255,61,242,.95), rgba(0,229,255,.90));
            color: #081018;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            border-radius: 12px;
            transition: transform 0.15s ease, filter 0.15s ease;
        }
        .input-row button:hover { transform: translateY(-1px); filter: brightness(1.05); }
    </style>
</head>
<body>
    <div class="nav"><a href="/welcome">← Back to Home</a></div>
    <div class="chat-container">
        <div class="panel">
            <h1>AI Assistant</h1>
            <p class="sub">Ask about our cafe, menu, or anything else.</p>
            <div class="messages">
                <p>Chat functionality will be added here.</p>
            </div>
            <div class="input-row">
                <input type="text" placeholder="Type your message..." />
                <button>Send</button>
            </div>
        </div>
    </div>
</body>
</html>
