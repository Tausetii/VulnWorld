<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VulnWorld Gaming Cafe – AI Chatbot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #0f0f0f; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
        .nav { padding: 1rem 2rem; border-bottom: 1px solid #333; }
        .nav a { color: #888; text-decoration: none; }
        .nav a:hover { color: #fff; }
        .chat-container { flex: 1; display: flex; flex-direction: column; max-width: 600px; width: 100%; margin: 0 auto; padding: 2rem; }
        h1 { font-size: 1.5rem; font-weight: 300; margin-bottom: 1.5rem; }
        .messages { flex: 1; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 1rem; min-height: 300px; overflow-y: auto; margin-bottom: 1rem; }
        .messages p { color: #ccc; font-style: italic; }
        .input-row { display: flex; gap: 8px; }
        .input-row input {
            flex: 1;
            background: transparent;
            border: 2px solid #333;
            color: #fff;
            padding: 12px 16px;
            font-size: 16px;
            outline: none;
            border-radius: 4px;
        }
        .input-row input:focus { border-color: #666; }
        .input-row input::placeholder { color: #666; }
        .input-row button {
            background: #fff;
            color: #000;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
        }
        .input-row button:hover { background: #ccc; }
    </style>
</head>
<body>
    <div class="nav"><a href="/welcome">← Back to Home</a></div>
    <div class="chat-container">
        <h1>AI Assistant</h1>
        <p style="color:#888; font-size:0.9rem; margin-bottom:1rem;">Ask about our cafe, menu, or anything else.</p>
        <div class="messages">
            <p>Chat functionality will be added here.</p>
        </div>
        <div class="input-row">
            <input type="text" placeholder="Type your message..." />
            <button>Send</button>
        </div>
    </div>
</body>
</html>
