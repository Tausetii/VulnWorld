<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VulnWorld Gaming Cafe – Food Menu</title>
    <style>
        :root{
            --bg1:#1b0b3a;
            --bg2:#031a3b;
            --card:rgba(255,255,255,.10);
            --stroke:rgba(255,255,255,.22);
            --text:#f8fbff;
            --muted:rgba(248,251,255,.72);
            --neon1:#ff3df2;
            --neon2:#00e5ff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body {
            color: var(--text);
            min-height: 100vh;
            padding: 2rem 1.5rem;
            background:
                radial-gradient(900px 400px at 20% 10%, rgba(255,61,242,.30), transparent 60%),
                radial-gradient(800px 420px at 85% 20%, rgba(0,229,255,.26), transparent 60%),
                linear-gradient(160deg, var(--bg1), var(--bg2));
        }
        .nav { margin-bottom: 1.5rem; }
        .nav a { color: var(--muted); text-decoration: none; }
        .nav a:hover { color: var(--text); text-shadow: 0 0 12px rgba(0,229,255,.35); }
        .panel{
            width: min(860px, 100%);
            margin: 0 auto;
            background: var(--card);
            border: 1px solid var(--stroke);
            border-radius: 18px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 18px 55px rgba(0,0,0,.35);
        }
        h1 { font-size: 1.9rem; font-weight: 650; margin-bottom: 0.75rem; }
        .hint { color: var(--muted); margin-bottom: 1rem; }
        .controls{ display:flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        input {
            background: rgba(0,0,0,.18);
            border: 1px solid rgba(255,255,255,.28);
            color: var(--text);
            padding: 12px 14px;
            font-size: 16px;
            width: 240px;
            outline: none;
            border-radius: 12px;
        }
        input:focus {
            border-color: rgba(0,229,255,.65);
            box-shadow: 0 0 0 4px rgba(0,229,255,.15);
        }
        button {
            background: linear-gradient(135deg, rgba(255,61,242,.95), rgba(0,229,255,.90));
            color: #081018;
            border: none;
            padding: 12px 18px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            border-radius: 12px;
            transition: transform 0.15s ease, filter 0.15s ease;
        }
        button:hover { transform: translateY(-1px); filter: brightness(1.05); }
        #results_list { list-style: none; margin-top: 1.25rem; max-width: 520px; padding: 0; }
        #results_list li {
            background: rgba(255,255,255,.08);
            border: 1px solid rgba(255,255,255,.18);
            padding: 12px 14px;
            margin-bottom: 10px;
            border-radius: 14px;
        }
        #results_list li:hover { border-color: rgba(255,61,242,.45); box-shadow: 0 0 20px rgba(255,61,242,.12); }
    </style>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        function search() {
            var budget = $("#budget_input").val();
            $.ajax({
                url: "/search/" + budget,
                method: "GET",
                success: function(response) {
                    $("#results_list").empty();
                    for (var i = 0; i < response.length; i++) {
                        var item = response[i];
                        $("#results_list").append("<li>" + item.name + " – $" + item.price + "</li>");
                    }
                },
                error: function() { $("#results_list").html("<li>No results or error.</li>"); }
            });
        }
    </script>
</head>
<body>
    <div class="nav"><a href="/welcome">← Back to Home</a></div>
    <div class="panel">
        <h1>Food Menu</h1>
        <p class="hint">See what you can get within your budget.</p>
        <div class="controls">
            <input id="budget_input" type="text" placeholder="Enter your budget (e.g. 5)" />
            <button onclick="search()">Search</button>
        </div>
        <ul id="results_list"></ul>
    </div>
</body>
</html>
