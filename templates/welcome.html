<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VulnWorld Gaming Cafe – Welcome</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #0f0f0f; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem; }
        h1 { font-size: 2.2rem; font-weight: 300; margin-bottom: 0.5rem; letter-spacing: 2px; }
        .tagline { color: #888; margin-bottom: 3rem; }
        nav { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
        nav a {
            display: block;
            background: #1a1a1a;
            border: 2px solid #333;
            color: #fff;
            padding: 14px 24px;
            text-decoration: none;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        nav a:hover { background: #fff; color: #000; border-color: #fff; transform: translateY(-2px); }
    </style>
</head>
<body>
    <h1>VulnWorld Gaming Cafe</h1>
    <p class="tagline">Play. Eat. Hang.</p>
    <nav>
        <a href="/menu">Food Menu</a>
        <a href="/about">About Us</a>
        <a href="/contact">Contact</a>
    </nav>
</body>
</html>
