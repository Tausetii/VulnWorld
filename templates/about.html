<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VulnWorld Gaming Cafe – About Us</title>
    <style>
        :root{
            --bg1:#1b0b3a;
            --bg2:#031a3b;
            --card:rgba(255,255,255,.10);
            --stroke:rgba(255,255,255,.22);
            --text:#f8fbff;
            --muted:rgba(248,251,255,.72);
            --neon1:#ff3df2;
            --neon2:#00e5ff;
            --neon3:#7CFF6B;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body {
            color: var(--text);
            min-height: 100vh;
            padding: 2rem 1.5rem;
            background:
                radial-gradient(900px 420px at 15% 12%, rgba(255,61,242,.30), transparent 60%),
                radial-gradient(820px 460px at 85% 22%, rgba(0,229,255,.26), transparent 60%),
                radial-gradient(700px 520px at 55% 90%, rgba(124,255,107,.16), transparent 62%),
                linear-gradient(160deg, var(--bg1), var(--bg2));
        }
        .wrap{ max-width: 860px; margin: 0 auto; }
        .nav { margin-bottom: 1.5rem; }
        .nav a { color: var(--muted); text-decoration: none; }
        .nav a:hover { color: var(--text); text-shadow: 0 0 12px rgba(0,229,255,.35); }
        .panel{
            background: var(--card);
            border: 1px solid var(--stroke);
            border-radius: 18px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 18px 55px rgba(0,0,0,.35);
        }
        h1 { font-size: 1.9rem; font-weight: 700; margin-bottom: 0.75rem; }
        p { color: rgba(248,251,255,.82); line-height: 1.7; margin-bottom: 1rem; }
        /* Events chips moved to /events */
    </style>
</head>
<body>
    <div class="wrap">
        <div class="nav"><a href="/welcome">← Back to Home</a></div>
        <div class="panel">
            <h1>About Us</h1>
            <p>VulnWorld Gaming Cafe was founded by a small team of gamers who wanted a place to play, eat, and meet other players. We’re a local spot focused on good vibes and good food.</p>
            <p>This page can be expanded later with owner bios, story, and photos.</p>
        </div>
    </div>
</body>
</html>
